<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок 3 — Практика</title>
    <style>
      #game-loading{position:fixed;inset:0;z-index:9000;display:grid;place-content:center;justify-items:center;gap:22px;padding:24px;background:radial-gradient(ellipse at center,#284b53,#152b36);color:#dceee7;font:500 clamp(18px,4vw,24px)/1.5 system-ui,sans-serif;text-align:center;transition:opacity .4s;overscroll-behavior:contain}
      #game-loading p{margin:0;max-width:460px}
      #game-loading.leaving{opacity:0;pointer-events:none}
      .loading-ring{width:48px;height:48px;border:3px solid #729c9638;border-top-color:#b5e6d4;border-radius:50%;animation:loading-spin 1.1s linear infinite}
      #game-loading button{font:inherit;font-size:17px;padding:12px 28px;border:1px solid #9dc8bc;border-radius:9px;background:#bfddd0;color:#143d44;cursor:pointer}
      #game-loading button:focus-visible{outline:3px solid #efc677;outline-offset:4px}
      #game-loading[hidden],#game-loading [hidden]{display:none}
      @keyframes loading-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.loading-ring{animation:none}#game-loading{transition:none}}
    </style>
      <script>
      // Vite replaces the module tag, so listen before the generated entry loads.
      (() => {
        const isEntry = event => event.target instanceof HTMLScriptElement && event.target.type === 'module';
        const cleanup = () => {
          document.removeEventListener('error', failed, true);
          document.removeEventListener('load', loaded, true);
        };
        const loaded = event => { if (isEntry(event)) cleanup(); };
        const failed = event => {
          if (!isEntry(event)) return;
          cleanup();
          const show = () => {
            const panel = document.getElementById('game-loading');
            if (!panel) return;
            panel.hidden = false;
            panel.querySelector('p').textContent = 'Не удалось загрузить игру. Проверьте соединение и попробуйте снова.';
            panel.querySelector('.loading-ring').hidden = true;
            panel.querySelector('button').hidden = false;
            panel.setAttribute('aria-busy', 'false');
          };
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show, {once:true});
          else show();
        };
        document.addEventListener('error', failed, true);
        document.addEventListener('load', loaded, true);
      })();
    </script>
  </head>
  <body>
    <section id="game-loading" role="status" aria-live="polite" aria-busy="true">
      <div class="loading-ring" aria-hidden="true"></div>
      <p>Загружаем мир…</p>
      <button type="button" hidden onclick="location.reload()">Повторить</button>
    </section>
    <div id="app">
      <canvas id="game" tabindex="0" aria-label="Практика третьего урока"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
